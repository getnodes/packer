name: Packer
on:
  workflow_dispatch:
jobs:
  packer:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.15.3"
      - name: Init
        run: packer init hcl
      - name: Lint
        run: packer fmt -check hcl
      - name: Validate
        run: packer validate hcl
      - name: Build
        run: packer build hcl
