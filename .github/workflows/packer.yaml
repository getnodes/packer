name: Packer
run-name: ${{ startsWith(github.ref, 'refs/tags/') && 'build' || 'validate' }} on ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
jobs:
  packer:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.15.3"
      - name: Init
        run: packer init .
      - name: Lint
        run: packer fmt -check .
      - name: Validate
        run: packer validate .
      - name: Build
        if: startsWith(github.event.ref, 'refs/tags/v')
        run: packer build .
