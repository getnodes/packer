name: Packer
on:
  workflow_dispatch:
    inputs:
      base:
        type: boolean
      lb:
        type: boolean
      pritunl:
        type: boolean
jobs:
  packer:
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.15.3"
      - run: rm hcl/base.pkr.hcl
        if: ${{ inputs.base == false }}
      - run: rm hcl/lb.pkr.hcl
        if: ${{ inputs.lb == false }}
      - run: rm hcl/pritunl.pkr.hcl
        if: ${{ inputs.pritunl == false }}
      - name: Init
        run: packer init hcl
      - name: Lint
        run: packer fmt -check hcl
      - name: Validate
        run: packer validate hcl
      - name: Build
        run: packer build hcl
